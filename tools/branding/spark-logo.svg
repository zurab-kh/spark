<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="256" height="256">
  <!-- Spark app icon: a white S with lightning-bolt tips on a storm-night tile. make-icon.ps1 draws the same geometry. -->
  <defs>
    <clipPath id="tile"><rect x="2" y="2" width="96" height="96" rx="22" /></clipPath>
    <radialGradient id="sky" gradientUnits="userSpaceOnUse" cx="50" cy="45" r="75">
      <stop offset="0" stop-color="#4B3BFF" />
      <stop offset="0.55" stop-color="#1E1466" />
      <stop offset="1" stop-color="#0A0726" />
    </radialGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#9FD8FF" stop-opacity="0.6" />
      <stop offset="1" stop-color="#9FD8FF" stop-opacity="0" />
    </radialGradient>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="100" height="100" fill="url(#sky)" />
    <circle cx="50" cy="50" r="44" fill="url(#glow)" />
    <g fill="#FFFFFF">
      <circle cx="20" cy="18" r="1.2" opacity="0.8" />
      <circle cx="82" cy="30" r="1" opacity="0.6" />
      <circle cx="14" cy="64" r="0.9" opacity="0.5" />
      <circle cx="86" cy="80" r="1.3" opacity="0.7" />
    </g>
  </g>
  <path d="M72 25 C64 17 40 15 32 27 C26 37 34 45 48 48 L58 50 C72 53 76 64 70 74 C62 86 38 86 28 76"
        fill="none" stroke="#FFFFFF" stroke-width="15" stroke-linejoin="miter" stroke-miterlimit="10" />
  <polygon points="64,13 88,10 76,30 68,24" fill="#FFFFFF" />
  <polygon points="34,70 34,90 10,88 24,70" fill="#FFFFFF" />
</svg>
